server:
    host: 0.0.0.0
    port: 8080
    read_timeout: 30s
    write_timeout: 2m0s
    shutdown_timeout: 10s
auth:
    enabled: true
    keys:
        - key: sk-gateway-demo-key
          name: demo-user
          roles:
            - admin
redis:
    addr: localhost:6379
    password: ""
    db: 0
routes:
    - id: deepseek-chat
      model: deepseek-chat
      upstream: deepseek-primary
      priority: 100
    - id: deepseek-reasoner
      model: deepseek-reasoner
      upstream: deepseek-primary
      priority: 100
    - id: deepseek-all
      model: deepseek-*
      upstream: deepseek-primary
      priority: 90
    - id: default
      model: '*'
      upstream: deepseek-primary
      fallbacks:
        - openai-fallback
      priority: 0
upstreams:
    - name: deepseek-primary
      endpoint: https://api.deepseek.com
      provider: openai
      api_token: sk-57e761a3fa574dafa49e51da517133cf
      model: deepseek-chat
      weight: 10
      timeout: 2m0s
      retry_count: 3
      health_check:
        interval: 30s
        timeout: 5s
    - name: openai-fallback
      endpoint: https://api.openai.com
      provider: openai
      api_token: ""
      weight: 7
      timeout: 30s
      retry_count: 0
rate_limit:
    enabled: false
semantic:
    enabled: false
    provider: deepseek-primary
    threshold: 0.75
    categories:
        - name: code-generation
          examples:
            - write a function to sort an array
            - implement a binary search tree in python
            - refactor this code to use goroutines
          target: deepseek-primary
          priority: 100
        - name: chat-conversation
          examples:
            - hello how are you
            - tell me a joke
            - what is your name
          target: deepseek-primary
          priority: 50
        - name: reasoning
          examples:
            - explain the theory of relativity
            - what is the meaning of life
            - compare capitalism and socialism
          target: deepseek-primary
          priority: 80
semantic_cache:
    enabled: false
    threshold: 0.92
    ttl: 10m
    max_entries: 1000
cost:
    enabled: false
    default_limit:
        input_tokens: 1000000
        output_tokens: 500000
        window: 1h
    key_limits:
        - key_name: demo-user
          limit:
            input_tokens: 100000
            output_tokens: 50000
            window: 24h
    degrade:
        action: warn
        cheaper_provider: deepseek-primary
        alert_webhook: ""
        alert_threshold: 0.8
security:
    prompt_injection:
        enabled: false
        action: block
        risk_threshold: medium
    pii:
        enabled: false
        action: mask
log:
    level: info
    format: text
