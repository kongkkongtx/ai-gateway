apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  labels:
    app: ai-gateway
data:
  gateway.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 30s
      write_timeout: 120s
      shutdown_timeout: 10s

    auth:
      enabled: true
      keys:
        - key: "sk-gateway-demo-key"
          name: "demo-user"
          roles: ["admin"]

    routes:
      - id: "deepseek-chat"
        model: "deepseek-chat"
        upstream: "deepseek-primary"
        priority: 100
      - id: "deepseek-all"
        model: "deepseek-*"
        upstream: "deepseek-primary"
        priority: 90
      - id: "default"
        model: "*"
        upstream: "deepseek-primary"
        priority: 0

    upstreams:
      - name: "deepseek-primary"
        endpoint: "https://api.deepseek.com"
        provider: "openai"
        api_token: ""
        model: "deepseek-chat"
        weight: 10
        timeout: 120s
        retry_count: 3
        health_check:
          interval: 30s
          timeout: 5s

    rate_limit:
      enabled: false

    log:
      level: "info"
      format: "json"