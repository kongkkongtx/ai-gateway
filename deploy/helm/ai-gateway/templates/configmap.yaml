apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.fullname" . }}-config
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  gateway.yaml: |
    {{- if .Values.gateway.configContent }}
    {{ .Values.gateway.configContent | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.gateway.config | nindent 4 }}
    {{- end }}
