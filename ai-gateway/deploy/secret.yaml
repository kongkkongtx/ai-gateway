# Create the secret with your actual DeepSeek API key:
#   kubectl create secret generic ai-gateway-secrets \
#     --from-literal=deepseek_api_key='sk-your-key-here'
#
# Or from a file:
#   kubectl create secret generic ai-gateway-secrets \
#     --from-file=deepseek_api_key=./deepseek_key.txt
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  labels:
    app: ai-gateway
type: Opaque
stringData:
  # Replace with your actual key before applying
  deepseek_api_key: "sk-placeholder-replace-me"