apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ai-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config"
            - "/etc/ai-gateway/gateway.yaml"
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            # Inject the API key from a Kubernetes Secret (create manually)
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: deepseek_api_key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/ai-gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: ai-gateway-config