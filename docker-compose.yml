version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_REDIS_ADDR: redis:6379
      GATEWAY_REDIS_DB: "0"
    volumes:
      - ./configs/gateway.yaml:/app/configs/gateway.yaml
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
